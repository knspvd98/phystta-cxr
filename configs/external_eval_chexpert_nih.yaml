# External evaluation branch for CheXpert + NIH.
# No real-pair realism or temporal pair-building path is used here; this config is for external synthetic-shift evaluation and stratified reporting only.
# Runtime harmonization re-expresses source-native labels into the MIMIC/CheXpert 14-label head space and writes label_harmonization_manifest.json for auditability.
# This template is intended for same-pod follow-up after a successful CLIP-lineage internal run.
# The model subtree may still be replaced by scripts/materialize_external_followup_configs.py,
# but the default operator-facing contract should already match the current CLIP frozen-artifact line.
data:
  sources:
    - name: chexpert
      root: /workspace/data/chexpert
      metadata_csv: /workspace/data/chexpert/train.csv
      image_root: /workspace/data/chexpert
      path_col: Path
      patient_id_col: PatientID
      study_id_col: Study
      sex_col: Sex
      age_col: Age
      view_col: AP/PA
      view_family_col: Frontal/Lateral
      label_cols:
        - No Finding
        - Enlarged Cardiomediastinum
        - Cardiomegaly
        - Lung Opacity
        - Lung Lesion
        - Edema
        - Consolidation
        - Pneumonia
        - Atelectasis
        - Pneumothorax
        - Pleural Effusion
        - Pleural Other
        - Fracture
        - Support Devices
    - name: nih
      root: /workspace/data/nih_chestxray14
      metadata_csv: /workspace/data/nih_chestxray14/Data_Entry_2017.csv
      image_root: /workspace/data/nih_chestxray14/images
      path_col: Image Index
      patient_id_col: Patient ID
      labels_from_findings_col: Finding Labels
      sex_col: Patient Gender
      age_col: Patient Age
      view_col: View Position
      label_cols:
        - Atelectasis
        - Cardiomegaly
        - Effusion
        - Infiltration
        - Mass
        - Nodule
        - Pneumonia
        - Pneumothorax
        - Consolidation
        - Edema
        - Emphysema
        - Fibrosis
        - Pleural_Thickening
        - Hernia
  split_group_key: global_patient_id
  index_dir: /workspace/outputs/external_eval_chexpert_nih/index_runtime
  cache_dir: /workspace/.cache/phystta/external_eval_chexpert_nih
model:
  architecture: clip-vit-base-patch32
  family: transformer
  num_classes: 14
  use_medical_pretrain: true
  encoder:
    encoder_source: hf_clip_or_vit
    model_id: openai/clip-vit-base-patch32
    revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
    head_path: /workspace/outputs/paperpilot_mimic_artifacts/heads/head.pt
    head_meta_path: /workspace/outputs/paperpilot_mimic_artifacts/heads/head_meta.json
    input_adapter:
      repeat_to_3: true
      image_size: 224
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
intervention:
  shift_types: [heel, scatter, exposure, poisson]
  use_realism: false
  group_key: global_patient_id
erasure_eval:
  scenario_mode: atomic_calibrated_eval
  shift_types: [heel, scatter]
  modes: [clinical, fairness, safety]
  fairness_groups: [sex, age, view_family]
shift_id:
  group_key: view_family
safety_policy:
  stratify_technical: true
  strata_keys: [view_family]
runtime:
  device: cpu
  seed: 2026
  freeze_artifacts: true
  allow_download: false
output:
  root: /workspace/outputs/external_eval_chexpert_nih
  run_name: external_eval
