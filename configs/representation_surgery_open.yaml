# Open-data-only fallback config.
# Paths below assume normalized metadata generated by scripts/prepare_open_cxr_metadata.py.
data:
  prebuilt_index_csv: data_indexes/representation_surgery_open_index.csv
  prebuilt_index_sha256: null
  label_cols:
  - No Finding
  - Atelectasis
  - Cardiomegaly
  - Consolidation
  - Edema
  - Pneumothorax
  - Pleural Effusion
  - Pneumonia
  sources:
  - name: padchest
    root: /data/padchest
    metadata_csv: /data/padchest/metadata/padchest_metadata.csv
    image_root: /data/padchest/images
    path_col: path
    patient_id_col: patient_id
    study_id_col: study_id
    view_col: view
    age_col: age
    sex_col: sex
    label_cols:
    - No Finding
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Pneumothorax
    - Pleural Effusion
    - Pneumonia
  - name: chexpert
    root: /data/chexpert
    metadata_csv: /data/chexpert/metadata/chexpert_metadata.csv
    image_root: /data/chexpert
    path_col: path
    patient_id_col: patient_id
    study_id_col: study_id
    view_col: view
    age_col: age
    sex_col: sex
    label_cols:
    - No Finding
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Pneumothorax
    - Pleural Effusion
    - Pneumonia
  - name: nih_chestxray14
    root: /data/nih_chestxray14
    metadata_csv: /data/nih_chestxray14/metadata/nih_chestxray14_metadata.csv
    image_root: /data/nih_chestxray14/images
    path_col: path
    patient_id_col: patient_id
    study_id_col: study_id
    view_col: view
    age_col: age
    sex_col: sex
    label_cols:
    - No Finding
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Pneumothorax
    - Pleural Effusion
    - Pneumonia
  preprocess:
    image_size: 224
    normalize_mean: 0.0
    normalize_std: 1.0
  model_representation: intensity
  split_fractions:
    train_head: 0.45
    val_head: 0.05
    train_eraser: 0.2
    calib: 0.1
    eval: 0.2
  split_group_key: global_patient_id
  train_sources:
  - padchest
  - chexpert
  val_sources:
  - chexpert
  test_sources:
  - nih_chestxray14
  head_split: train_head
  head_val_split: val_head
  eraser_split: train_eraser
  calib_split: calib
  eval_split: eval
model:
  architecture: clip-vit-base-patch32
  family: transformer
  num_classes: 8
  use_medical_pretrain: true
  encoder:
    encoder_source: hf_clip_or_vit
    model_id: openai/clip-vit-base-patch32
    revision: 3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
    head_path: outputs/heads/clip_head_open.pt
    head_meta_path: outputs/heads/clip_head_open.meta.json
    input_adapter:
      repeat_to_3: true
      image_size: 224
      mean:
      - 0.48145466
      - 0.4578275
      - 0.40821073
      std:
      - 0.26862954
      - 0.26130258
      - 0.27577711
train:
  batch_size: 16
  epochs: 1
runtime:
  device: cpu
  seed: 2024
  deterministic: true
  benchmark: false
  freeze_artifacts: false
  allow_download: true
output:
  root: ./outputs
  run_name: representation_surgery_open
intervention:
  shift_types:
  - heel
  - scatter
  - exposure
  - poisson
  - mixed
  intensity_grid:
  - 0.0
  - 0.2
  - 0.4
  - 0.6
  mixed_profiles:
  - name: scatter_heel
    components:
      scatter: 0.6
      heel: 0.3
  - name: exposure_poisson
    components:
      exposure: 0.4
      poisson: 0.2
  max_images: 200
  token_budget: 100000
  probe_chunk_size: 20000
  token_sampling: random
  token_sample_per_image: 64
  use_realism: false
  realism_path: null
  realism_levels:
  - 0.0
  - 0.5
  - 1.0
  k: 8
  fit_method: probe_xfit
  probe_target: presence
  group_key: global_patient_id
  pair_quality:
    max_delta_hours: 24.0
    label_change_weight: 0.45
    view_change_weight: 0.2
    context_change_weight: 0.2
    sentinel_change_weight: 0.15
    technical_dominant_max_risk: 0.25
eraser:
  type: steering
  task_preserve: head_subspace
  k: 8
  steering_hidden: 256
  steering_steps: 200
  steering_lr: 0.001
  steering_eps: 0.01
  token_mode: patch
  token_layers: 2
  online_enabled: false
  online_mode: entropy
  online_entropy_steps: 8
  online_entropy_lr: 0.01
erasure_eval:
  split: eval
  shift_types:
  - heel
  - mixed
  intensity_grid:
  - 0.0
  - 0.2
  - 0.4
  - 0.6
  modes:
  - clinical
  - probing
  - causal_invariance
  - safety
  - fairness
  coverage: 0.8
  fairness_groups:
  - sex
  - age
metrics:
  calibration_bins: 15
  min_group_size: 50
shift_id:
  label_space: nature
  group_key: source
  score_family:
  - mmd
  - ks
  - cond_mmd
  batch_sizes:
  - 100
  - 250
  - 500
  n_splits: 3
  calibration: platt
safety_policy:
  apply_on_covariate: true
  abstain_on_mixed: true
  abstain_on_unknown: true
  use_decision_policy: true
  uncertainty_abstain_threshold: 0.35
  mixed_abstain_threshold: 0.4
  prevalence_action: recalibrate
  cost_fn: 10.0
  cost_fp: 1.0
  coverage_budget: 0.8
  critical_labels: []
  conformal: false
  risk_target: 0.05
  conformal_alpha: 0.05
  shared_threshold: true
  stratify_technical: true
  strata_keys:
  - source
  - view
monitoring:
  enabled: false
vlm:
  enabled: false
experiment:
  tier: dev
  open_data_fallback: true
