[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phystta"
version = "0.2.0"
description = "Reliability and representation-intervention research for chest X-ray models under technical shifts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dias Konyspayev" }]
keywords = [
  "chest-xray",
  "medical-imaging",
  "machine-learning",
  "robustness",
  "reliability",
  "test-time-adaptation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<12",
  "pydicom>=2.4,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
]

[project.optional-dependencies]
full = [
  "huggingface-hub>=0.30,<1",
  "iterative-stratification>=0.1.9,<1",
  "open-clip-torch>=2.30,<4",
  "timm>=1,<2",
  "torchxrayvision>=1.2,<2",
  "transformers>=4.50,<6",
]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/knspvd98/phystta-cxr"
Repository = "https://github.com/knspvd98/phystta-cxr"
Publication = "https://doi.org/10.52167/1609-1817-2026-144-3-300-312"

[project.scripts]
phystta = "phystta.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["phystta*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
